# Demuestra la separación en microservicios: un servicio de API y, cuando se
# pase de SQLite a PostgreSQL, un servicio de base de datos independiente.
services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data

  # Descomentar al pasar de SQLite a PostgreSQL (cambiar también DATABASE_URL en .env):
